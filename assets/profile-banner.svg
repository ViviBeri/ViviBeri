<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
<title id="title">ViviBeri — Engineering, AI and Open Source</title>
<desc id="desc">A premium cinematic technology banner with layered glass geometry, luminous circuit pathways, a dimensional digital core, and subtle animated light.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".48" stop-color="#0a1730"/><stop offset="1" stop-color="#160d2d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee7ff"/><stop offset=".48" stop-color="#6685ff"/><stop offset="1" stop-color="#d18bff"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f7ff" stop-opacity=".28"/><stop offset=".45" stop-color="#6c8cff" stop-opacity=".07"/><stop offset="1" stop-color="#d28aff" stop-opacity=".18"/></linearGradient>
  <radialGradient id="blueGlow"><stop stop-color="#167dff" stop-opacity=".5"/><stop offset="1" stop-color="#167dff" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#9d42ff" stop-opacity=".36"/><stop offset="1" stop-color="#9d42ff" stop-opacity="0"/></radialGradient>
  <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cbaff" stroke-opacity=".075"/><circle cx="0" cy="0" r="1" fill="#9bdcff" fill-opacity=".18"/></pattern>
  <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1600" height="480" rx="28"/></clipPath>
</defs>
<style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif}
  .ambient{animation:breathe 9s ease-in-out infinite}
  .orbit{transform-origin:1280px 230px;animation:orbit 42s linear infinite}
  .float{transform-origin:1280px 230px;animation:float 7s ease-in-out infinite}
  .scan{animation:scan 8s ease-in-out infinite}
  .spark{animation:spark 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes scan{0%,100%{transform:translateX(-180px);opacity:0}15%,75%{opacity:.8}90%{transform:translateX(500px);opacity:0}}
  @keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.ambient,.orbit,.float,.scan,.spark{animation:none}}
</style>
<g clip-path="url(#clip)">
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#microgrid)"/>
  <ellipse class="ambient" cx="1230" cy="235" rx="510" ry="330" fill="url(#blueGlow)" filter="url(#blur24)"/>
  <ellipse class="ambient" cx="1490" cy="75" rx="330" ry="260" fill="url(#violetGlow)" filter="url(#blur24)"/>
  <path d="M0 365C260 300 430 460 720 380S1210 300 1600 360" fill="none" stroke="url(#edge)" stroke-opacity=".2" stroke-width="2"/>
  <path d="M0 390C300 325 460 480 760 405S1260 325 1600 385" fill="none" stroke="url(#edge)" stroke-opacity=".1" stroke-width="1"/>
  <g opacity=".55" fill="none" stroke="url(#edge)" stroke-width="1.5">
    <path d="M930 92H1080L1140 152H1260L1320 92H1510"/>
    <path d="M960 352H1080L1150 282H1280L1350 352H1540"/>
    <path d="M1080 92V352M1140 152V282M1320 92V352M1450 92V352"/>
    <path d="M900 220H1040L1100 180H1170M1390 220H1500"/>
  </g>
  <g fill="#a9eaff" filter="url(#glow)" class="spark">
    <circle cx="930" cy="92" r="3"/><circle cx="1140" cy="152" r="4"/><circle cx="1320" cy="92" r="3"/><circle cx="1510" cy="92" r="3"/>
    <circle cx="960" cy="352" r="3"/><circle cx="1150" cy="282" r="4"/><circle cx="1350" cy="352" r="3"/><circle cx="1540" cy="352" r="3"/>
  </g>
  <g class="orbit" fill="none" stroke="url(#edge)">
    <ellipse cx="1280" cy="230" rx="174" ry="78" stroke-opacity=".22" stroke-width="2"/>
    <ellipse cx="1280" cy="230" rx="174" ry="78" transform="rotate(58 1280 230)" stroke-opacity=".34" stroke-width="1.5" stroke-dasharray="7 13"/>
    <ellipse cx="1280" cy="230" rx="174" ry="78" transform="rotate(-58 1280 230)" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="3 11"/>
  </g>
  <g class="float" filter="url(#shadow)">
    <path d="M1280 112L1382 171V289L1280 348L1178 289V171Z" fill="url(#metal)" stroke="url(#edge)" stroke-opacity=".9" stroke-width="2"/>
    <path d="M1280 135L1360 181V279L1280 325L1200 279V181Z" fill="#0b1933" fill-opacity=".8" stroke="#8bb8ff" stroke-opacity=".4"/>
    <path d="M1280 135V325M1200 181L1360 279M1360 181L1200 279" stroke="url(#edge)" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M1241 201L1264 224L1241 247M1319 201L1296 224L1319 247M1290 190L1270 258" fill="none" stroke="#c5eaff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="1280" cy="230" r="6" fill="#e6f7ff" filter="url(#glow)"/>
  </g>
  <path class="scan" d="M1050 112L1510 112" stroke="#d6f5ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <g transform="translate(88 92)">
    <rect width="5" height="258" rx="2.5" fill="url(#edge)"/>
    <text x="42" y="88" fill="#f7fbff" font-size="86" font-weight="760" letter-spacing="-3">ViviBeri</text>
    <rect x="44" y="111" width="438" height="4" rx="2" fill="url(#edge)"/>
    <text x="44" y="164" fill="#d9eaff" font-size="30" font-weight="650" letter-spacing="1.6">ENGINEERING  ·  AI  ·  OPEN SOURCE</text>
    <text x="44" y="211" fill="#a9bddb" font-size="22">Building practical software and reliable tools.</text>
    <g transform="translate(44 252)" font-size="16" font-weight="650" letter-spacing="1">
      <rect width="164" height="40" rx="20" fill="#102b48" stroke="#57d8ff" stroke-opacity=".7"/>
      <text x="82" y="26" fill="#c4f2ff" text-anchor="middle">WEB &amp; ANDROID</text>
      <rect x="178" width="108" height="40" rx="20" fill="#1d2048" stroke="#8b9aff" stroke-opacity=".75"/>
      <text x="232" y="26" fill="#d9ddff" text-anchor="middle">AI TOOLS</text>
      <rect x="300" width="172" height="40" rx="20" fill="#2a1947" stroke="#cb91ff" stroke-opacity=".75"/>
      <text x="386" y="26" fill="#f0dcff" text-anchor="middle">OPEN SOURCE</text>
    </g>
  </g>
  <text x="1280" y="438" fill="#9bb4d8" font-size="14" letter-spacing="3" text-anchor="middle">BUILD  ·  AUTOMATE  ·  CONTRIBUTE  ·  SOLVE</text>
  <path d="M50 465H1550" stroke="url(#edge)" stroke-opacity=".55" stroke-width="2"/>
</g>
</svg>