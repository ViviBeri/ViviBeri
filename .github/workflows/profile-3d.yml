# Generate a 3D contribution calendar for the profile README.
# A change to this workflow file also triggers an immediate generation run.
name: Generate 3D contribution profile

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

concurrency:
  group: profile-3d-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Add subtle motion to the dark green calendar
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          svg = path.read_text(encoding="utf-8")

          css = """
          .calendar-motion {
            transform-box: fill-box;
            transform-origin: center;
            animation: calendar-float 8s ease-in-out infinite;
          }
          @keyframes calendar-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(0.18deg); }
          }
          @media (prefers-reduced-motion: reduce) {
            .calendar-motion { animation: none; }
          }
          """

          if "calendar-float" not in svg:
              if "</style>" not in svg or "</rect><g>" not in svg:
                  raise SystemExit("Unexpected SVG structure; refusing to alter generated calendar.")
              svg = svg.replace("</style>", css + "</style>", 1)
              svg = svg.replace("</rect><g>", '</rect><g class="calendar-motion">', 1)
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit generated contribution visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "chore: refresh 3D contribution profile" || exit 0
          git push
