<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">ViviBeri open-source engineering journey</title>
<desc id="d">An animated timeline connecting practical projects, automated testing, merged open-source contributions, and ongoing maintenance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#101b35"/><stop offset="1" stop-color="#1b1234"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8db8ff" stroke-opacity=".08"/></pattern>
</defs>
<style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}
 .route{stroke-dasharray:16 12;animation:flow 14s linear infinite}
 .node{transform-box:fill-box;transform-origin:center;animation:rise 5s ease-in-out infinite}
 .node:nth-of-type(2){animation-delay:.5s}.node:nth-of-type(3){animation-delay:1s}.node:nth-of-type(4){animation-delay:1.5s}
 .pulse{animation:pulse 3.5s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-280}}
 @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.route,.node,.pulse{animation:none}}
</style>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/><rect width="1400" height="420" rx="28" fill="url(#grid)"/>
<circle cx="1100" cy="95" r="180" fill="#2563eb" opacity=".08"/><circle cx="190" cy="360" r="170" fill="#a855f7" opacity=".08"/>
<text x="70" y="62" fill="#f4f8ff" font-size="27" font-weight="750" letter-spacing="2">ENGINEERING IN MOTION</text>
<text x="70" y="96" fill="#9eb4d3" font-size="16">From useful ideas to tested releases and maintainer-reviewed contributions</text>
<path d="M150 218H1250" stroke="#385174" stroke-width="7" stroke-linecap="round"/>
<path class="route" d="M150 218H1250" stroke="url(#line)" stroke-width="4" fill="none" filter="url(#glow)"/>
<g class="node" transform="translate(150 218)">
 <circle r="48" fill="#0d2943" stroke="#38bdf8" stroke-width="2"/><circle class="pulse" r="35" fill="none" stroke="#38bdf8" stroke-opacity=".65" stroke-width="2"/>
 <path d="M-14 5L0-14L14 5L0 17Z" fill="none" stroke="#b9efff" stroke-width="3"/>
 <text x="0" y="82" text-anchor="middle" fill="#e8f5ff" font-size="20" font-weight="700">BUILD</text><text x="0" y="108" text-anchor="middle" fill="#9eb4d3" font-size="14">GradeCalc · LeadFlow</text>
</g>
<g class="node" transform="translate(515 218)">
 <circle r="48" fill="#17284b" stroke="#818cf8" stroke-width="2"/><circle class="pulse" r="35" fill="none" stroke="#818cf8" stroke-opacity=".65" stroke-width="2"/>
 <path d="M-18-8L-5 5L18-18M-18 16H18" fill="none" stroke="#d8dcff" stroke-width="3" stroke-linecap="round"/>
 <text x="0" y="82" text-anchor="middle" fill="#e8eaff" font-size="20" font-weight="700">VERIFY</text><text x="0" y="108" text-anchor="middle" fill="#9eb4d3" font-size="14">Tests · CI · releases</text>
</g>
<g class="node" transform="translate(885 218)">
 <circle r="48" fill="#29204d" stroke="#c084fc" stroke-width="2"/><circle class="pulse" r="35" fill="none" stroke="#c084fc" stroke-opacity=".65" stroke-width="2"/>
 <path d="M-18-13H18V12H-18ZM-9-3H9M-9 5H5" fill="none" stroke="#f0dcff" stroke-width="3" stroke-linejoin="round"/>
 <text x="0" y="82" text-anchor="middle" fill="#f4eaff" font-size="20" font-weight="700">CONTRIBUTE</text><text x="0" y="108" text-anchor="middle" fill="#9eb4d3" font-size="14">Merged · reviewed PRs</text>
</g>
<g class="node" transform="translate(1250 218)">
 <circle r="48" fill="#123a3c" stroke="#34d399" stroke-width="2"/><circle class="pulse" r="35" fill="none" stroke="#34d399" stroke-opacity=".65" stroke-width="2"/>
 <path d="M-16 2L-4 14L18-13" fill="none" stroke="#c8ffe7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="0" y="82" text-anchor="middle" fill="#dcfff0" font-size="20" font-weight="700">IMPROVE</text><text x="0" y="108" text-anchor="middle" fill="#9eb4d3" font-size="14">Maintain · iterate</text>
</g>
<text x="70" y="386" fill="#7f9bbd" font-size="13" letter-spacing="1.8">PRACTICAL ENGINEERING  /  OPEN SOURCE  /  CONTINUOUS LEARNING</text>
</svg>