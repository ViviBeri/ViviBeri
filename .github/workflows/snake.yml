name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ViviBeri
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
