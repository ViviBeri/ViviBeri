<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">GitHub Octocat cursor banner</title>
<desc id="desc">GitHub's recognizable Octocat mark on a dark developer-themed banner. Click the banner in the profile README to open the interactive demo.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#070b14"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60f5bd"/><stop offset="1" stop-color="#63a8ff"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#91b9e7" stroke-opacity=".12"/></pattern>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="320" rx="28" fill="url(#bg)"/><rect width="1200" height="320" rx="28" fill="url(#grid)"/>
<ellipse cx="950" cy="160" rx="170" ry="130" fill="#4fe8b6" opacity=".13" filter="url(#shadow)"/>
<circle cx="1050" cy="60" r="3" fill="#66f4bd"/><circle cx="790" cy="235" r="4" fill="#6bb7ff"/><circle cx="1130" cy="230" r="3" fill="#66f4bd"/>
<path d="M780 75l7 7m0-7l-7 7M1100 100l8 8m0-8l-8 8" stroke="#6bb7ff" stroke-width="2" opacity=".8"/>
<text x="68" y="78" fill="#63f5bd" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">GITHUB-INSPIRED INTERACTIVE BANNER</text>
<text x="68" y="143" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Meet the Octocat.</text>
<text x="70" y="184" fill="#a9bad2" font-family="Arial,sans-serif" font-size="21">A little GitHub spirit for my developer profile.</text>
<rect x="68" y="218" width="245" height="42" rx="21" fill="#0c2825" stroke="#285b4d"/>
<circle cx="91" cy="239" r="5" fill="#63f5bd"/><text x="108" y="245" fill="#c8ffe9" font-family="Arial,sans-serif" font-size="15" font-weight="600">CLICK TO MEET THE CAT</text>
