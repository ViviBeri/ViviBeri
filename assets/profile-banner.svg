<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">ViviBeri — Engineering, AI and Open Source</title>
  <desc id="desc">A dark professional technology banner with animated blue and violet light trails, a connected digital network, and the ViviBeri engineering portfolio identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset=".55" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#9333ea" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8ab4ff" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#93c5fd" fill-opacity=".16"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="480" rx="28" fill="url(#grid)"/>
  <ellipse cx="1240" cy="240" rx="440" ry="310" fill="url(#glowA)" filter="url(#soft)">
    <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="950" cy="20" rx="420" ry="210" fill="url(#glowB)" filter="url(#soft)">
    <animate attributeName="opacity" values="1;.45;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M0 390 C260 340 410 440 660 390 S1090 330 1600 390" fill="none" stroke="url(#accent)" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 410 C260 360 410 460 660 410 S1090 350 1600 410" fill="none" stroke="url(#accent)" stroke-opacity=".12" stroke-width="1"/>
  <g opacity=".7" fill="none" stroke="url(#accent)" stroke-width="1.5">
    <path d="M1030 95 L1160 160 L1280 95 L1400 160 L1510 95"/>
    <path d="M1030 335 L1160 270 L1280 335 L1400 270 L1510 335"/>
    <path d="M1160 160 L1160 270 M1280 95 L1280 335 M1400 160 L1400 270"/>
  </g>
  <g fill="#9bdcff" filter="url(#neon)">
    <circle cx="1030" cy="95" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="160" r="4"><animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1280" cy="95" r="4"><animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="160" r="4"><animate attributeName="r" values="4;7;4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1510" cy="95" r="4"/>
    <circle cx="1030" cy="335" r="4"/>
    <circle cx="1160" cy="270" r="4"/>
    <circle cx="1280" cy="335" r="4"/>
    <circle cx="1400" cy="270" r="4"/>
    <circle cx="1510" cy="335" r="4"/>
  </g>
  <g transform="translate(1250 215)" fill="none" stroke="url(#accent)" filter="url(#neon)">
    <circle r="112" stroke-opacity=".22" stroke-width="2"/>
    <circle r="82" stroke-opacity=".42" stroke-width="2" stroke-dasharray="5 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -48 L42 -24 L42 24 L0 48 L-42 24 L-42 -24 Z" stroke-width="3"/>
    <path d="M-20 -12 L-5 0 L-20 12 M20 -12 L5 0 L20 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-8 22 L8 -22" stroke-width="3" stroke-linecap="round"/>
    <circle r="4" fill="#9bdcff" stroke="none"/>
  </g>
  <g transform="translate(88 100)">
    <rect x="0" y="0" width="5" height="245" rx="2.5" fill="url(#accent)"/>
    <text x="42" y="102" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="86" font-weight="750" letter-spacing="-3">ViviBeri</text>
    <rect x="44" y="124" width="410" height="4" rx="2" fill="url(#accent)"/>
    <text x="44" y="178" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="600" letter-spacing="1.5">ENGINEERING  ·  AI  ·  OPEN SOURCE</text>
    <text x="44" y="224" fill="#a8b7d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Building practical software and reliable tools.</text>
    <g transform="translate(44 278)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="1.2">
      <rect width="168" height="42" rx="21" fill="#102747" stroke="#38bdf8" stroke-opacity=".7"/>
      <text x="84" y="27" fill="#bae6fd" text-anchor="middle">WEB &amp; ANDROID</text>
      <rect x="182" width="112" height="42" rx="21" fill="#1c1b42" stroke="#818cf8" stroke-opacity=".7"/>
      <text x="238" y="27" fill="#c7d2fe" text-anchor="middle">AI TOOLS</text>
      <rect x="308" width="176" height="42" rx="21" fill="#24183f" stroke="#c084fc" stroke-opacity=".7"/>
      <text x="396" y="27" fill="#e9d5ff" text-anchor="middle">OPEN SOURCE</text>
    </g>
  </g>
  <text x="1245" y="438" fill="#8ba7d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3" text-anchor="middle">BUILD  ·  AUTOMATE  ·  CONTRIBUTE  ·  SOLVE</text>
  <path d="M50 465H1550" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>