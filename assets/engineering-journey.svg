<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d"><title id="t">ViviBeri engineering journey</title><desc id="d">Animated timeline: build, verify, contribute and improve.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#1b1234"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.route{stroke-dasharray:16 12;animation:flow 14s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-280}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style><rect width="1400" height="420" rx="28" fill="url(#bg)"/><text x="70" y="62" fill="#f4f8ff" font-size="27" font-weight="750" letter-spacing="2">ENGINEERING IN MOTION</text><text x="70" y="96" fill="#9eb4d3" font-size="16">From useful ideas to tested releases and maintainer-reviewed contributions</text><path d="M150 220H1250" stroke="#385174" stroke-width="7" stroke-linecap="round"/><path class="route" d="M150 220H1250" stroke="url(#line)" stroke-width="4"/><circle cx="150" cy="220" r="48" fill="#0d2943" stroke="#38bdf8" stroke-width="3"/><circle class="pulse" cx="150" cy="220" r="35" fill="none" stroke="#38bdf8" stroke-width="3"/><path d="M136 225L150 203L164 225L150 238Z" fill="none" stroke="#b9efff" stroke-width="3"/><circle cx="515" cy="220" r="48" fill="#17284b" stroke="#818cf8" stroke-width="3"/><circle class="pulse" cx="515" cy="220" r="35" fill="none" stroke="#818cf8" stroke-width="3"/><path d="M495 216L509 230L535 202M495 242H535" fill="none" stroke="#e1e3ff" stroke-width="3"/><circle cx="885" cy="220" r="48" fill="#29204d" stroke="#c084fc" stroke-width="3"/><circle class="pulse" cx="885" cy="220" r="35" fill="none" stroke="#c084fc" stroke-width="3"/><path d="M867 202H903V238H867ZM875 214H895M875 224H895" fill="none" stroke="#f0dcff" stroke-width="3"/><circle cx="1250" cy="220" r="48" fill="#123a3c" stroke="#34d399" stroke-width="3"/><circle class="pulse" cx="1250" cy="220" r="35" fill="none" stroke="#34d399" stroke-width="3"/><path d="M1232 220L1245 233L1269 206" fill="none" stroke="#c8ffe7" stroke-width="4" stroke-linecap="round"/><text x="150" y="302" text-anchor="middle" fill="#e8f5ff" font-size="21" font-weight="700">BUILD</text><text x="150" y="328" text-anchor="middle" fill="#9eb4d3" font-size="15">GradeCalc · LeadFlow</text><text x="515" y="302" text-anchor="middle" fill="#e8eaff" font-size="21" font-weight="700">VERIFY</text><text x="515" y="328" text-anchor="middle" fill="#9eb4d3" font-size="15">Tests · CI · releases</text><text x="885" y="302" text-anchor="middle" fill="#f4eaff" font-size="21" font-weight="700">CONTRIBUTE</text><text x="885" y="328" text-anchor="middle" fill="#9eb4d3" font-size="15">Merged · reviewed PRs</text><text x="1250" y="302" text-anchor="middle" fill="#dcfff0" font-size="21" font-weight="700">IMPROVE</text><text x="1250" y="328" text-anchor="middle" fill="#9eb4d3" font-size="15">Maintain · iterate</text><text x="70" y="386" fill="#7f9bbd" font-size="13" letter-spacing="1.8">PRACTICAL ENGINEERING / OPEN SOURCE / CONTINUOUS LEARNING</text></svg>